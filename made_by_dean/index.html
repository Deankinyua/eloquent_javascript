<!doctype html>

  <body>
    <div>start</div>

    <svg viewBox="0 0 200 200">
      <path
        id="my-path"
        d="  
        M 40,40
        Q 45,65
          25,65
        M 40,40
        Q 50,75

        id="motion-blur"
        x="-25%"
        width="150%"
        color-interpolation-filters="sRGB"
      >
        <feGaussianBlur in="SourceGraphic" />

      <circle
        id="cartoon-face"
        cx="220"
        cy="70"
        r="10"
        filter="url(#motion-blur)"
      />
      <circle id="eye-1" cx="210" cy="67.5" r="0.5" fill="white" />
      <circle id="eye-2" cx="210" cy="67.5" r="0.5" fill="white" />

      <line class="line-1" />

      <line class="line-2" />

      <line class="line-3" />

      <line class="line-4" />

      <line class="line-5" />
    </svg>

    <script type="module" src="./svg.js"></script>
